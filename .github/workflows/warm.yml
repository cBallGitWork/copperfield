name: Warm

# Keeps the two matchday pages rendered while football is on.
#
# The pages revalidate every 30 seconds (`PAGE_REVALIDATE`), and the request that
# arrives after a window expires is the one that pays for the re-render — a
# Fantrax read, an FPL read, and the whole page. On a Saturday at three o'clock
# that request is a manager's phone, and sixteen of them arrive at once, which is
# the worst possible moment for the slowest render in the app.
#
# So this fires first. It is a curl, not a browser: the point is to leave a warm
# entry in the server's cache, and a plain GET does that as well as a page view.
#
# Deliberately narrow. Only `/` and `/matchday`, because they are the two pages a
# phone actually lands on during a round, and warming the rest would spend
# Fantrax reads on pages nobody is looking at.

on:
  # By hand only since 17 Oct 2026, when the account's Actions minutes ran out: an hourly curl kept a 30-second page
  # warm one minute in sixty, and Health walks the live app for 5xx. It was every 5, 15, 30 and 60 minutes before.
  workflow_dispatch:

# It reads, and writes only its alert issue.
permissions:
  contents: read
  issues: write

# Warming is only useful now. A run queued behind another has already missed the
# window it was for, so the newer one replaces it.
concurrency:
  group: warm
  cancel-in-progress: true

jobs:
  warm:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # The alert action and its script, nothing else.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts/ci
            .github/actions

      - name: Warm the pages a phone lands on
        env:
          BASE: ${{ vars.WARM_BASE_URL }}
        run: |
          # Unset means the deployment url was never configured. Say so and stop:
          # curling nothing would report success every five minutes forever.
          if [ -z "$BASE" ]; then
            echo "WARM_BASE_URL repository variable is not set — nothing to warm."
            exit 1
          fi
          for path in / /matchday; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 25 "${BASE}${path}")
            echo "${path} ${code}"
            # A warm that 500s is worth knowing about: it means the page sixteen
            # phones are about to ask for is broken, and the job that noticed is
            # the one running while the round is on.
            case "$code" in 2*|3*) ;; *) exit 1 ;; esac
          done

      # A red or timed-out run opens or updates the issue "alert: warm"; the next green one closes it.
      - uses: ./.github/actions/alert
        if: ${{ always() }}
        with:
          source: warm
          status: ${{ job.status }}
