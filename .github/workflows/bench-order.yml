name: Bench order

# Five minutes before each lineup lock, every bench its manager left unnumbered is numbered by total points with the
# commissioner's session (`scripts/bench-order.ts`, Craig, 9 Oct 2026). GitHub's cron runs late and drops runs (only
# two a day fired in early Nov, and GW10's lock on 6 Nov passed unwritten), so a run waits for any lock inside 330
# minutes, and a run after a lock fails if that lock left a bench unnumbered. A numbered bench is left alone.

on:
  schedule:
    # 07–19 UTC only (16 and 17 Oct 2026, Actions minutes): the first run's window opens 07:23, before any lock a
    # 11:30 London kickoff makes, and the last reaches 21:53, past a 20:15 winter kickoff's.
    - cron: "23 7-19 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Print each team's plan and write nothing
        type: boolean
        default: true
      team:
        description: Only this Fantrax team id (blank for every team)
        type: string
        default: ""
      now:
        description: Write now rather than in the last minutes (never after the lock)
        type: boolean
        default: false
      period:
        description: A Fantrax period already locked, to write late (with after_lock)
        type: string
        default: ""
      after_lock:
        description: Write that period after its lock, in adminMode (a run GitHub dropped)
        type: boolean
        default: false

# An hourly firing queues behind a run already waiting for a lock instead of starting a second waiter.
concurrency:
  group: bench-order
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  order:
    runs-on: ubuntu-latest
    # Above the longest wait (the window less the five minutes, plus the setup), under the hosted runner's 360.
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/node

      - name: Ask production which league it serves
        id: league
        uses: ./.github/actions/league
        with:
          base: ${{ vars.WARM_BASE_URL }}

      # 330 minutes: one run in five and a half hours before a lock is enough, which GitHub's dropped runs still give.
      - name: Order the benches
        env:
          FANTRAX_LEAGUE_ID: ${{ steps.league.outputs.id }}
          FANTRAX_COOKIE: ${{ secrets.FANTRAX_COOKIE }}
          DRY_RUN: ${{ inputs.dry_run }}
          TEAM: ${{ inputs.team }}
          NOW: ${{ inputs.now }}
          PERIOD: ${{ inputs.period }}
          AFTER_LOCK: ${{ inputs.after_lock }}
        run: |
          args=()
          if [ "${{ github.event_name }}" = schedule ]; then
            args=(--wait --within 330 --write)
          else
            [ "$DRY_RUN" = true ] || args+=(--write)
            [ "$NOW" = true ] && args+=(--now)
            [ -n "$TEAM" ] && args+=(--team "$TEAM")
            [ -n "$PERIOD" ] && args+=(--period "$PERIOD")
            [ "$AFTER_LOCK" = true ] && args+=(--after-lock)
          fi
          npx tsx scripts/bench-order.ts "${args[@]}"

      # A red or timed-out run opens or updates the issue "alert: bench-order"; the next green one closes it.
      - uses: ./.github/actions/alert
        if: ${{ always() }}
        with:
          source: bench-order
          status: ${{ job.status }}
